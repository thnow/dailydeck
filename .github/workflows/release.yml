name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    name: Version matches tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/version.py check "$GITHUB_REF_NAME"

  python:
    name: sdist & wheel
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python
          path: dist/*

  deb:
    name: Ubuntu package
    needs: check
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci/build-deb.sh "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

  # Future platform jobs (see docs/RELEASING.md) plug in here and upload their
  # installers as artifacts; the release job below collects everything.

  release:
    name: GitHub release
    needs: [python, deb]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Release notes
        run: python3 scripts/version.py notes "$GITHUB_REF_NAME" > notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*|*~*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "dailydeck ${GITHUB_REF_NAME#v}" --notes-file notes.md $prerelease
