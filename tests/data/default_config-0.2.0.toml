# dailydeck – Stream-Deck-Profile pro Anwendung
#
# Die Datei wird im laufenden Betrieb neu geladen, sobald sie gespeichert wird.
#
# Profile werden von oben nach unten geprüft, das erste passende gewinnt.
#   match  = Liste von Kennungen der Anwendung (Groß-/Kleinschreibung egal,
#            Platzhalter * und ? erlaubt). Verglichen wird mit WM-Klasse,
#            Desktop-ID (Linux), EXE-Name (Windows) bzw. Bundle-ID (macOS).
#            Die Kennungen des aktiven Fensters zeigt:
#              .venv/bin/python -m dailydeck --print-focus
#   title  = optionaler regulärer Ausdruck auf den Fenstertitel
#   default = true  -> wird benutzt, wenn kein anderes Profil passt
#   icon   = optional eigenes Bild statt des automatisch gefundenen Programmicons
#   font   = optional eigene Schriftart für dieses Profil, z. B. "Ubuntu:Bold"
#
# Tasten (buttons) werden der Reihe nach belegt (oben links nach unten rechts).
# Ein leerer [[profiles.buttons]]-Block lässt eine Taste frei. Hat ein Profil
# mehr Tasten als das Deck, wird die letzte Taste zum Blättern benutzt.
#   label      Beschriftung (\n für Zeilenumbruch)
#   keys       Kürzel, z. B. "primary+shift+t", "alt+F4", "primary++", "super".
#              Folgen mit Leerzeichen: "primary+k primary+c".
#              Modifier: primary, ctrl/strg, shift, alt/option, altgr, super/win/cmd
#              primary ist der Haupt-Modifier des Systems: ⌘ auf dem Mac, sonst Strg.
#              So gilt ein Profil auf allen Systemen; ctrl bleibt überall Strg
#              (z. B. ctrl+c zum Abbrechen im Terminal).
#   keys_macos, keys_windows, keys_linux
#              optional: auf diesem System stattdessen senden, wenn das Programm
#              dort ganz andere Tasten nutzt (z. B. Umbenennen im Finder: "enter").
#              Zeichen werden passend zum Tastaturlayout gesendet; auf dem Mac
#              wird dabei z. B. "cmd+[" auf deutschem Layout zu ⌘Ö wie im Menü.
#              Benannte Tasten: enter, esc, tab, space, backspace, delete,
#              insert, home, end, pageup, pagedown, up, down, left, right,
#              f1–f24, print, menu, volumeup, volumedown, mute, playpause,
#              nexttrack, prevtrack, plus, minus
#   color      Hintergrundfarbe der Taste, text_color Schriftfarbe
#   icon       Pfad zu einem Bild (relativ zu dieser Datei)
#   font_size  maximale Schriftgröße

[settings]
brightness = 60          # 0–100
show_keys = true         # Kürzel klein unter der Beschriftung anzeigen
poll_interval = 0.25     # Sekunden zwischen Fokus-Abfragen
background = "#1e1e1e"
text_color = "#ffffff"
# font = "Ubuntu:Bold"   # "Familie:Stil" (siehe fc-list) oder Pfad zu einer Schriftdatei

# Programmicon der aktiven Anwendung über das ganze Deck legen
app_icon = true
app_icon_brightness = 0.7   # Helligkeit des Icons hinter den Tasten (0–1)
button_opacity = 0.35       # Deckkraft der Tastenfarbe über dem Icon (0–1)
app_icon_flash = 0.6        # Sekunden, die das Icon beim Wechsel voll aufleuchtet (0 = aus)
key_spacing = 36            # Abstand der Tasten in Pixeln, damit das Icon durchgehend wirkt

# [keyboard]             # nur Linux; Standard: aus den GNOME-Einstellungen
# layout = "de"
# variant = "nodeadkeys"

