# Daily Deck – Stream Deck profiles per application
#
# The file is reloaded while running as soon as it is saved.
#
# Profiles are checked from top to bottom, the first match wins.
#   match  = list of application identifiers (case-insensitive, wildcards
#            * and ? allowed). Compared with the WM class, desktop ID (Linux),
#            EXE name (Windows) or bundle ID (macOS).
#            The identifiers of the active window are shown by:
#              dailydeck --print-focus
#   title  = optional regular expression on the window title
#   default = true  -> used when no other profile matches
#   icon   = optional own image (or symbol, see below) instead of the app icon
#   font   = optional own font for this profile, e.g. "Ubuntu:Bold"
#
# Keys (buttons) are assigned in order (top left to bottom right).
# An empty [[profiles.buttons]] block leaves a key free. If a profile has
# more keys than the deck, the last key turns the pages.
#   label      text on the key (\n for a line break, a soft hyphen or | in the
#              editor marks where a long word may be hyphenated)
#   keys       shortcut, e.g. "primary+shift+t", "alt+F4", "primary++", "super".
#              Sequences separated by spaces: "primary+k primary+c".
#              Modifiers: primary, ctrl, shift, alt/option, altgr, super/win/cmd
#              primary is the system's main modifier: ⌘ on the Mac, Ctrl elsewhere.
#              So one profile works on every system; ctrl stays Ctrl everywhere
#              (e.g. ctrl+c to interrupt in the terminal).
#   keys_macos, keys_windows, keys_linux
#              optional: sent instead on that system when the app uses
#              entirely different keys there (e.g. rename in Finder: "enter").
#              Characters are sent according to the keyboard layout; on the Mac,
#              e.g. "cmd+[" on a German layout becomes ⌘Ö like in the menu.
#              Named keys: enter, esc, tab, space, backspace, delete,
#              insert, home, end, pageup, pagedown, up, down, left, right,
#              f1–f24, print, menu, volumeup, volumedown, mute, playpause,
#              nexttrack, prevtrack, plus, minus
#   color      background colour of the key, text_color text colour
#   icon       path to an image (relative to this file) or a built-in symbol
#              drawn in the text colour, e.g. "symbol:play" (names from
#              lucide.dev; the editor shows all of them under "Symbol …")
#   font_size  maximum font size
#
# Profile names and labels are translated into your language when this file
# is created; after that it is yours to edit.

[settings]
brightness = 60          # 0–100
show_keys = true         # show the shortcut small below the label
poll_interval = 0.25     # seconds between focus checks
background = "#1e1e1e"
text_color = "#ffffff"
# font = "Ubuntu:Bold"   # "Family:Style" (see fc-list) or path to a font file

# show the icon of the active application across the whole deck
app_icon = true
app_icon_brightness = 0.7   # brightness of the icon behind the keys (0–1)
button_opacity = 0.35       # opacity of the key colour over the icon (0–1)
app_icon_flash = 0.6        # seconds the icon lights up fully on a switch (0 = off)
key_spacing = 36            # gap between the keys in pixels, so the icon looks continuous

# [keyboard]             # Linux only; default: from the GNOME settings
# layout = "de"
# variant = "nodeadkeys"

